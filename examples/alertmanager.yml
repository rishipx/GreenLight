# Alertmanager receiver for GreenLight. Store the shared secret in your secret manager.
receivers:
  - name: greenlight
    webhook_configs:
      - url: https://greenlight.example.com/api/v1/webhooks/alertmanager
        http_config:
          authorization:
            type: Bearer
            credentials: REPLACE_WITH_ALERTMANAGER_WEBHOOK_SECRET

route:
  receiver: greenlight
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 30m
