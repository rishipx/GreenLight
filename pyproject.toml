[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenlight"
dynamic = ["version"]
description = "AI-assisted incident triage with human approval and isolated, allowlisted remediation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["incident-response", "sre", "observability", "remediation", "fastapi"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Framework :: FastAPI",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "httpx==0.28.1",
  "openai==1.59.7",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "ruff==0.8.4",
]

[project.scripts]
greenlight-worker = "greenlight.worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "greenlight.__version__" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
"src/greenlight/core/privacy.py" = ["E501"]  # long regular expressions
"tests/**" = ["E501", "E402"]
