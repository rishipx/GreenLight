name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greenlight
          POSTGRES_PASSWORD: greenlight
          POSTGRES_DB: greenlight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenlight -d greenlight_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Shell scripts
        run: |
          shellcheck agents/journal/greenlight-journal.sh scripts/simulate_incident.sh
      - name: Unit, SQLite and PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://greenlight:greenlight@localhost:5432/greenlight_test
        run: pytest -q --cov=greenlight --cov-report=term-missing
      - name: schema.sql applies cleanly
        env:
          PGPASSWORD: greenlight
        run: |
          createdb -h localhost -U greenlight schema_check
          psql -h localhost -U greenlight -d schema_check -v ON_ERROR_STOP=1 -q -f database/schema.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t greenlight:ci .
      - name: Image starts and imports cleanly
        run: docker run --rm greenlight:ci python -c "import greenlight; print(greenlight.__version__)"
      - name: Container runs as a non-root user on a read-only root filesystem
        run: |
          uid="$(docker run --rm --read-only greenlight:ci id -u)"
          test "$uid" = "10001"
      - name: Compose files are valid
        run: |
          docker compose --profile n8n config --quiet
          GREENLIGHT_DOMAIN=greenlight.example.com docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
