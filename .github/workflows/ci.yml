name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: greenlight
          POSTGRES_PASSWORD: greenlight
          POSTGRES_DB: greenlight_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U greenlight -d greenlight_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Shell scripts
        run: |
          shellcheck agents/journal/greenlight-journal.sh scripts/simulate_incident.sh
      - name: Unit, SQLite and PostgreSQL tests
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://greenlight:greenlight@localhost:5432/greenlight_test
        run: pytest -q
      - name: schema.sql applies cleanly
        env:
          PGPASSWORD: greenlight
        run: |
          createdb -h localhost -U greenlight schema_check
          psql -h localhost -U greenlight -d schema_check -v ON_ERROR_STOP=1 -q -f database/schema.sql

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t greenlight:ci .
      - name: Image starts and imports cleanly
        run: docker run --rm greenlight:ci python -c "import greenlight; print(greenlight.__version__)"
